<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A phone with a cracked shield">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#262052"/>
      <stop offset="55%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0b0a14"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#8c80ff"/>
    </pattern>
    <radialGradient id="dotfade" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="600" height="400" fill="url(#dotfade)"/>
    </mask>
  </defs>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect width="600" height="400" fill="url(#dots)" opacity="0.32" mask="url(#dotmask)"/>
  <!-- phone -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="222" y="66" width="156" height="268" rx="22" fill="#16132a" stroke="#b7a6ff" stroke-width="5"/>
    <line x1="278" y1="88" x2="322" y2="88" stroke="#8c80ff" stroke-width="5"/>
    <circle cx="300" cy="308" r="4.5" fill="#8c80ff" stroke="none" opacity="0.7"/>
  </g>
  <!-- shield: cracked on one half, holding on the other -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 138 L346 156 V204 C346 242 326 264 300 276 C274 264 254 242 254 204 V156 Z" fill="#0b0a14" stroke="#b7a6ff" stroke-width="5"/>
    <polyline points="282,158 292,184 278,206 290,232" stroke="#8c80ff" stroke-width="4"/>
    <path d="M306 204 l9 10 l17 -19" stroke="#00ff41" stroke-width="6"/>
  </g>
</svg>
