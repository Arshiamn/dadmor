<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A funnel of visitors and a cart under a magnifier">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#262052"/>
      <stop offset="55%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0b0a14"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#8c80ff"/>
    </pattern>
    <radialGradient id="dotfade" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="600" height="400" fill="url(#dotfade)"/>
    </mask>
  </defs>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect width="600" height="400" fill="url(#dots)" opacity="0.32" mask="url(#dotmask)"/>
  <!-- visitors raining into the funnel -->
  <g fill="#8c80ff" stroke="none">
    <circle cx="215" cy="58" r="6" opacity="0.55"/>
    <circle cx="268" cy="42" r="7" opacity="0.85"/>
    <circle cx="322" cy="60" r="5.5" opacity="0.65"/>
    <circle cx="372" cy="42" r="6.5" opacity="0.8"/>
    <circle cx="300" cy="84" r="5" opacity="0.9"/>
  </g>
  <!-- funnel -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M168 108 H432 L334 210 V268 L266 288 V210 Z" fill="#16132a" stroke="#b7a6ff" stroke-width="5"/>
    <circle cx="300" cy="196" r="5" fill="#8c80ff" stroke="none" opacity="0.8"/>
  </g>
  <!-- magnifier over the cart -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="408" cy="292" r="54" fill="#0b0a14" stroke="#b7a6ff" stroke-width="5"/>
    <line x1="446" y1="330" x2="484" y2="366" stroke="#b7a6ff" stroke-width="7"/>
    <path d="M382 272 h54 l-7 28 h-40 Z" stroke="#00ff41" stroke-width="4.5"/>
    <line x1="370" y1="262" x2="380" y2="272" stroke="#00ff41" stroke-width="4.5"/>
    <circle cx="394" cy="312" r="4.5" fill="#00ff41" stroke="none"/>
    <circle cx="424" cy="312" r="4.5" fill="#00ff41" stroke="none"/>
  </g>
</svg>
