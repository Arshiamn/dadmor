<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A price tag and coins">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#262052"/>
      <stop offset="55%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0b0a14"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#8c80ff"/>
    </pattern>
    <radialGradient id="dotfade" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="600" height="400" fill="url(#dotfade)"/>
    </mask>
  </defs>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect width="600" height="400" fill="url(#dots)" opacity="0.32" mask="url(#dotmask)"/>
  <!-- price tag -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 148 C138 118 168 122 182 142" stroke="#8c80ff" stroke-width="3.5" opacity="0.75"/>
    <g transform="rotate(-16 268 196)">
      <path d="M186 136 h176 l80 60 -80 60 H186 a18 18 0 0 1 -18 -18 V154 a18 18 0 0 1 18 -18 Z" fill="#16132a" stroke="#b7a6ff" stroke-width="5"/>
      <circle cx="204" cy="196" r="13" fill="#0b0a14" stroke="#8c80ff" stroke-width="4"/>
      <line x1="252" y1="176" x2="336" y2="176" stroke="#8c80ff" stroke-width="7" opacity="0.7"/>
      <line x1="252" y1="216" x2="312" y2="216" stroke="#8c80ff" stroke-width="7" opacity="0.45"/>
    </g>
  </g>
  <!-- coins, one with the green core -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="448" cy="292" r="35" fill="#16132a" stroke="#b7a6ff" stroke-width="4.5"/>
    <circle cx="448" cy="292" r="22" stroke="#8c80ff" stroke-width="3" opacity="0.65"/>
    <circle cx="514" cy="316" r="26" fill="#16132a" stroke="#b7a6ff" stroke-width="4.5"/>
    <circle cx="514" cy="316" r="15" stroke="#8c80ff" stroke-width="3" opacity="0.65"/>
    <circle cx="484" cy="248" r="21" fill="#16132a" stroke="#b7a6ff" stroke-width="4.5"/>
    <circle cx="484" cy="248" r="9" fill="#00ff41" stroke="none"/>
  </g>
</svg>
