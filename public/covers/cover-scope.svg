<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A signed document with a seal of approval">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#262052"/>
      <stop offset="55%" stop-color="#141126"/>
      <stop offset="100%" stop-color="#0b0a14"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.4" fill="#8c80ff"/>
    </pattern>
    <radialGradient id="dotfade" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="68%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotmask">
      <rect width="600" height="400" fill="url(#dotfade)"/>
    </mask>
  </defs>
  <rect width="600" height="400" fill="url(#glow)"/>
  <rect width="600" height="400" fill="url(#dots)" opacity="0.32" mask="url(#dotmask)"/>
  <!-- document -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M220 322 V66 a4 4 0 0 1 4 -4 h112 l48 48 v212 a4 4 0 0 1 -4 4 H224 a4 4 0 0 1 -4 -4 Z" fill="#16132a" stroke="#b7a6ff" stroke-width="5"/>
    <path d="M336 62 l48 48 h-48 Z" fill="#262052" stroke="#b7a6ff" stroke-width="4"/>
    <line x1="248" y1="146" x2="356" y2="146" stroke="#8c80ff" stroke-width="7" opacity="0.75"/>
    <line x1="248" y1="182" x2="356" y2="182" stroke="#8c80ff" stroke-width="7" opacity="0.6"/>
    <line x1="248" y1="218" x2="330" y2="218" stroke="#8c80ff" stroke-width="7" opacity="0.6"/>
    <line x1="248" y1="254" x2="342" y2="254" stroke="#8c80ff" stroke-width="7" opacity="0.45"/>
  </g>
  <!-- seal with the green check -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="372" cy="292" r="35" fill="#0b0a14" stroke="#b7a6ff" stroke-width="4.5"/>
    <circle cx="372" cy="292" r="26" stroke="#8c80ff" stroke-width="2.5" opacity="0.6"/>
    <path d="M354 292 l13 13 l24 -27" stroke="#00ff41" stroke-width="7"/>
  </g>
</svg>
